[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshclone"
version = "0.1.0"
description = "Verify README shell commands in disposable, restricted Docker containers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
freshclone = "freshclone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker or a Chromium browser"]

[project.urls]
Repository = "https://github.com/beweiskette/freshclone"
